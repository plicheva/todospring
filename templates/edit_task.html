{% extends "base.html" %}

{% block content %}
  <section class="list" style="max-width: 600px; margin: 0 auto;">
    <h2>Edit Task</h2>
    <form action="{{ url_for('edit_task', task_id=task.id) }}" method="post" style="display: grid; gap: 0.75rem;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>
        Title
        <input type="text" name="title" value="{{ task.title }}" required />
      </label>
      <label>
        Status
        <select name="status" required>
          {% for status in status_options %}
            <option value="{{ status }}" {% if status == task.status %}selected{% endif %}>
              {{ status_labels[status] }}
            </option>
          {% endfor %}
        </select>
      </label>
      <div style="display: flex; gap: 0.75rem;">
        <button type="submit">Save</button>
        <a href="{{ url_for('index') }}" class="secondary" style="display: inline-flex; align-items: center; justify-content: center; padding: 0.6rem 1rem; border-radius: 0.65rem; text-decoration: none;">Back</a>
      </div>
    </form>
  </section>
{% endblock %}
